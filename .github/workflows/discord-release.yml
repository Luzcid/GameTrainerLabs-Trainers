name: Discord Release Notification

on:
  release:
    types: [published]
  workflow_dispatch: # This adds a manual "Run workflow" button

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord Webhook
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: "Success"
          title: "🚀 New Release: ${{ github.event.release.name || 'Manual Test' }}"
          description: "${{ github.event.release.body || 'This is a manual test run.' }}"
          url: "${{ github.event.release.html_url || 'https://github.com/Luzcid/GameTrainerLabs-Trainers' }}"
          color: 0x00FF00
